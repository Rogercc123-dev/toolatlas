name: Build ToolAtlas
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - run: test -f dist/index.html
      - run: test -f dist/sitemap.xml
      - run: test -f dist/robots.txt
      - run: test "$(find dist -mindepth 2 -name index.html | wc -l)" -gt 300
